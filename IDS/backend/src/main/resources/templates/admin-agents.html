<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDS — Agent Status</title>
<style>
:root{--bg:#0a0e1a;--panel:#111827;--border:#1e2d45;--accent:#00d4ff;--red:#ef4444;--yellow:#eab308;--green:#22c55e;--text:#e2e8f0;--muted:#64748b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh;}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;}
.logo{color:var(--accent);font-size:18px;letter-spacing:4px;font-weight:bold;}
.hright{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:12px;}
.hright a{color:var(--accent);font-size:12px;}
.logout{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px;}
main{max-width:1100px;margin:32px auto;padding:0 20px;}
h2{font-size:15px;letter-spacing:3px;color:var(--accent);margin-bottom:14px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;margin-bottom:28px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center;}
.stat .num{font-size:24px;font-weight:bold;color:var(--text);}
.stat .lbl{font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:4px;}
.stat.online .num{color:var(--green);}
.stat.stale .num{color:var(--yellow);}
.stat.offline .num{color:var(--red);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{color:var(--muted);font-size:11px;letter-spacing:2px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
td{padding:10px;border-bottom:1px solid var(--border);}
.badge{padding:2px 10px;border-radius:10px;font-size:11px;letter-spacing:1px;}
.PENDING{background:rgba(234,179,8,.15);color:var(--yellow);}
.ACTIVE{background:rgba(34,197,94,.15);color:var(--green);}
.REVOKED{background:rgba(239,68,68,.15);color:var(--red);}
.ONLINE{background:rgba(34,197,94,.15);color:var(--green);}
.STALE{background:rgba(234,179,8,.15);color:var(--yellow);}
.OFFLINE{background:rgba(239,68,68,.15);color:var(--red);}
.NA{background:rgba(100,116,139,.15);color:var(--muted);}
.empty{color:var(--muted);font-size:13px;padding:8px 0;}
code{color:var(--accent);}
</style>
</head>
<body>
<header>
  <div class="logo">IDS</div>
  <div class="hright">
    <a th:href="@{/engines}">MY ENGINES</a>
    <a th:href="@{/admin/approvals}">ADMIN APPROVALS</a>
    <form th:action="@{/logout}" method="post" style="display:inline">
      <button class="logout" type="submit">SIGN OUT</button>
    </form>
  </div>
</header>
<main>
  <div class="panel">
    <h2>FLEET SUMMARY</h2>
    <div class="stats">
      <div class="stat"><div class="num" th:text="${totalUsers}"></div><div class="lbl">USERS</div></div>
      <div class="stat"><div class="num" th:text="${totalKeys}"></div><div class="lbl">KEYS</div></div>
      <div class="stat"><div class="num" th:text="${pendingCount}"></div><div class="lbl">PENDING</div></div>
      <div class="stat"><div class="num" th:text="${activeCount}"></div><div class="lbl">ACTIVE</div></div>
      <div class="stat"><div class="num" th:text="${revokedCount}"></div><div class="lbl">REVOKED</div></div>
      <div class="stat online"><div class="num" th:text="${onlineCount}"></div><div class="lbl">ONLINE</div></div>
      <div class="stat stale"><div class="num" th:text="${staleCount}"></div><div class="lbl">STALE</div></div>
      <div class="stat offline"><div class="num" th:text="${offlineCount}"></div><div class="lbl">OFFLINE</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>ALL AGENTS</h2>
    <p class="empty" th:if="${#lists.isEmpty(rows)}">No engine keys exist yet.</p>
    <table th:unless="${#lists.isEmpty(rows)}">
      <thead>
        <tr><th>OWNER</th><th>ENGINE NAME</th><th>KEY PREFIX</th><th>STATUS</th><th>LIVENESS</th><th>LAST SEEN</th><th>ALERTS</th></tr>
      </thead>
      <tbody>
        <tr th:each="r : ${rows}">
          <td th:text="${r.ownerEmail}"></td>
          <td th:text="${r.name}"></td>
          <td><code th:text="${r.keyPrefix != null} ? ${r.keyPrefix} + '…' : '—'"></code></td>
          <td><span class="badge" th:classappend="${r.status}" th:text="${r.status}"></span></td>
          <td><span class="badge" th:classappend="${r.livenessClass}" th:text="${r.liveness}"></span></td>
          <td th:text="${r.lastSeen}"></td>
          <td th:text="${r.alertCount}"></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
