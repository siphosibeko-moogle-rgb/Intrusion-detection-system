<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDS — My Engines</title>
<style>
:root{--bg:#0a0e1a;--panel:#111827;--border:#1e2d45;--accent:#00d4ff;--red:#ef4444;--yellow:#eab308;--green:#22c55e;--text:#e2e8f0;--muted:#64748b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh;}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;}
.logo{color:var(--accent);font-size:18px;letter-spacing:4px;font-weight:bold;}
.hright{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:12px;}
.hright a{color:var(--accent);font-size:12px;}
.logout{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px;}
main{max-width:900px;margin:32px auto;padding:0 20px;}
h2{font-size:15px;letter-spacing:3px;color:var(--accent);margin-bottom:14px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;margin-bottom:28px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{color:var(--muted);font-size:11px;letter-spacing:2px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
td{padding:10px;border-bottom:1px solid var(--border);}
.badge{padding:2px 10px;border-radius:10px;font-size:11px;letter-spacing:1px;}
.PENDING{background:rgba(234,179,8,.15);color:var(--yellow);}
.ACTIVE{background:rgba(34,197,94,.15);color:var(--green);}
.REVOKED{background:rgba(239,68,68,.15);color:var(--red);}
.ONLINE{background:rgba(34,197,94,.15);color:var(--green);}
.STALE{background:rgba(234,179,8,.15);color:var(--yellow);}
.OFFLINE{background:rgba(239,68,68,.15);color:var(--red);}
.NA{background:rgba(100,116,139,.15);color:var(--muted);}
label{display:block;font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:6px;}
input{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:14px;margin-bottom:16px;outline:none;}
input:focus{border-color:var(--accent);}
button.primary{padding:11px 26px;background:var(--accent);border:none;border-radius:6px;color:#000;font-weight:bold;font-family:inherit;font-size:13px;letter-spacing:2px;cursor:pointer;}
.msg{color:var(--green);font-size:12px;margin-bottom:16px;}
.err{color:var(--red);font-size:12px;margin-bottom:16px;}
.empty{color:var(--muted);font-size:13px;padding:8px 0;}
code{color:var(--accent);}
</style>
</head>
<body>
<header>
  <div class="logo">IDS</div>
  <div class="hright">
    <a th:if="${isAdmin}" th:href="@{/admin/approvals}">ADMIN APPROVALS</a>
    <a th:if="${isAdmin}" th:href="@{/admin/agents}">AGENT STATUS</a>
    <span th:text="${username}"></span>
    <form th:action="@{/logout}" method="post" style="display:inline">
      <button class="logout" type="submit">SIGN OUT</button>
    </form>
  </div>
</header>
<main>
  <p class="msg" th:if="${message}" th:text="${message}"></p>
  <p class="err" th:if="${error}" th:text="${error}"></p>

  <div class="panel">
    <h2>MY ENGINE KEYS</h2>
    <p class="empty" th:if="${#lists.isEmpty(keys)}">No engine keys yet — request one below.</p>
    <table th:unless="${#lists.isEmpty(keys)}">
      <thead>
        <tr><th>NAME</th><th>KEY PREFIX</th><th>STATUS</th><th>LIVENESS</th><th>LAST SEEN</th><th>ALERTS</th><th>REQUESTED</th><th>APPROVED</th></tr>
      </thead>
      <tbody>
        <tr th:each="k : ${keys}">
          <td th:text="${k.name}"></td>
          <td><code th:text="${k.keyPrefix != null} ? ${k.keyPrefix} + '…' : '—'"></code></td>
          <td><span class="badge" th:classappend="${k.status}" th:text="${k.status}"></span></td>
          <td><span class="badge" th:classappend="${k.livenessClass}" th:text="${k.liveness}"></span></td>
          <td th:text="${k.lastSeen}"></td>
          <td th:text="${k.alertCount}"></td>
          <td th:text="${#temporals.format(k.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
          <td th:text="${k.approvedAt != null} ? ${#temporals.format(k.approvedAt, 'yyyy-MM-dd HH:mm')} : '—'"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="panel">
    <h2>REQUEST NEW KEY</h2>
    <form th:action="@{/engines/request}" method="post">
      <label for="name">ENGINE NAME / DESCRIPTION</label>
      <input id="name" name="name" type="text" maxlength="120" required
             placeholder="e.g. Lab sensor — building B switch mirror">
      <button class="primary" type="submit">REQUEST KEY</button>
    </form>
  </div>
</main>
</body>
</html>
