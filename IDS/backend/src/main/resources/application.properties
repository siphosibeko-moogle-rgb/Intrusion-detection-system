server.port=8080

ids.jwt.secret=${IDS_JWT_SECRET}
ids.jwt.expiration=${IDS_JWT_EXPIRATION:86400000}


ids.engine.apikey=${IDS_ENGINE_APIKEY}

logging.level.com.ids=INFO
logging.level.org.springframework.security=WARN

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/ids_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.websocket.path=/ws
jwt.secret=${IDS_JWT_SECRET}
jwt.expiration=${IDS_JWT_EXPIRATION:86400000}

# Only health/info exposed — env/heapdump/configprops would leak DB password,
# JWT secret and engine API key.
management.endpoints.web.exposure.include=health,info
management.health.db.enabled=false
management.endpoint.health.show-details=never