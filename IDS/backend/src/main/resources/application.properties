server.port=8080

ids.jwt.secret=${IDS_JWT_SECRET}
ids.jwt.expiration=${IDS_JWT_EXPIRATION:86400000}


ids.engine.apikey=${IDS_ENGINE_APIKEY}

# Filesystem location of the engine-owned ids-whitelist.properties, edited via
# GET/PUT /api/config/whitelist-properties. Default suits dev runs launched
# from the backend module directory; override in Docker with a shared volume.
ids.whitelist.path=${IDS_WHITELIST_PATH:../engine/src/main/resources/ids-whitelist.properties}

logging.level.com.ids=INFO
logging.level.org.springframework.security=WARN

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/ids_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.websocket.path=/ws
jwt.secret=${IDS_JWT_SECRET}
jwt.expiration=${IDS_JWT_EXPIRATION:86400000}

management.endpoints.web.exposure.include=health
management.health.db.enabled=false
management.endpoint.health.show-details=never