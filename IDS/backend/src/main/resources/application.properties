server.port=8080

ids.jwt.secret=${IDS_JWT_SECRET}
ids.jwt.expiration=${IDS_JWT_EXPIRATION:86400000}

# Engine keys are per-engine now, issued via the web UI (request + admin
# approval) and validated against a SHA-256 hash in the engine_keys table.
# The old shared ids.engine.apikey is gone.

# One-time first-admin bootstrap — only applies while no ADMIN account
# exists (see AdminBootstrap). Unset both after the first login.
ids.bootstrap.admin.username=${IDS_ADMIN_USERNAME:}
ids.bootstrap.admin.password=${IDS_ADMIN_PASSWORD:}

# Alert throttling for whitelisted (trusted) sources — see AlertThrottleService.
# Per-detector overrides: ids.throttle.detectors.<THREAT_TYPE>.window / .escalation-threshold
ids.throttle.default.window=10m
ids.throttle.default.escalation-threshold=5
# example: brute force from a trusted host should escalate fast
#ids.throttle.detectors.BRUTE_FORCE.window=1m
#ids.throttle.detectors.BRUTE_FORCE.escalation-threshold=3

logging.level.com.ids=INFO
logging.level.org.springframework.security=WARN

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/ids_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.websocket.path=/ws
jwt.secret=${IDS_JWT_SECRET}
jwt.expiration=${IDS_JWT_EXPIRATION:86400000}

# Only health/info exposed — env/heapdump/configprops would leak DB password,
# JWT secret and engine API key.
management.endpoints.web.exposure.include=health,info
management.health.db.enabled=false
management.endpoint.health.show-details=never

# ── Trusted-networks provider feed sync ─────────────────────────────────────
# POST /api/trusted-networks/sync always works (manual trigger, JWT required);
# `enabled` only turns the scheduled cron run on. Default off so operators opt
# in to automatic trust changes deliberately.
ids.trusted-networks.sync.enabled=${IDS_TRUSTED_NETWORKS_SYNC_ENABLED:false}
ids.trusted-networks.sync.cron=${IDS_TRUSTED_NETWORKS_SYNC_CRON:0 0 4 * * *}
# AWS services to import (comma-separated, or ALL). Default CLOUDFRONT only:
# the full feed is ~7k+ prefixes and the engine scans ranges linearly.
ids.trusted-networks.sync.aws.services=${IDS_TRUSTED_NETWORKS_SYNC_AWS_SERVICES:CLOUDFRONT}
# Azure service tags to import. Full ServiceTags is ~40k prefixes — keep this list tight.
ids.trusted-networks.sync.azure.tags=${IDS_TRUSTED_NETWORKS_SYNC_AZURE_TAGS:AzureFrontDoor.Frontend}