services:

  db:
    image: postgres:15
    container_name: ids_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ids_db
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/IDS_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ids_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ids_backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ids_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      IDS_JWT_SECRET: ${IDS_JWT_SECRET}
      IDS_JWT_EXPIRATION: ${IDS_JWT_EXPIRATION:-86400000}
      IDS_ENGINE_APIKEY: ${IDS_ENGINE_APIKEY}
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/localhost/8080' && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: ids_engine
    depends_on:
      backend:
        condition: service_healthy

    network_mode: host

    cap_add:
      - NET_RAW
      - NET_ADMIN

    security_opt:
      - apparmor:unconfined

    volumes:
      - ./logs:/app/logs

    environment:
      IDS_ENGINE_USER: ${IDS_ENGINE_USER}
      IDS_ENGINE_PASS: ${IDS_ENGINE_PASS}
      IDS_ENGINE_APIKEY: ${IDS_ENGINE_APIKEY}

    command:
      - java
      - -jar
      - engine-1.0.0.jar
      - all
      - http://localhost:8080
      - /app/logs/ids-alerts.log

  kali:
    image: kalilinux/kali-rolling
    container_name: kali
    tty: true
    stdin_open: true

volumes:
  db_data: