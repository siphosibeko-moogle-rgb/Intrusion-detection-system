# ─────────────────────────────────────────────────────────────────────────────
# IDS detection-threshold tuning
#
# Every key below is OPTIONAL. A missing key (or a missing file) means the
# engine uses its built-in default — the values shown here. Uncomment and
# change a line to override it; invalid values (non-numeric, <= 0) are
# rejected at startup with a loud log line and the default is kept.
#
# Raise a threshold  → fewer alerts of that type (less sensitive).
# Lower a threshold  → more alerts of that type (more sensitive).
#
# Changes require an engine restart (loaded once at startup).
# ─────────────────────────────────────────────────────────────────────────────

# ── NmapScanDetector ─────────────────────────────────────────────────────────
# Net half-open SYNs (SYNs minus completed-handshake traffic) from one source
# to ONE destination within 2s before a SYN-scan alert. Raise if load-balancer
# health checks or aggressive monitoring trip it.
#nmap.syn.threshold=15

# NULL / FIN / XMAS crafted-flag packets to one destination within 2s.
# These flag combinations never occur legitimately, hence the low bar.
#nmap.nullfinxmas.threshold=3

# UDP packets from one source to one destination within 2s (rate half of the
# UDP-scan signal)...
#nmap.udp.threshold=10

# ...AND distinct UDP destination ports required in the same window
# (diversity half — separates a scan from an RTP/DNS/NTP stream).
#nmap.udp.unique.ports=4

# Distinct destination ports on ONE host within 2s before a port-sweep alert.
#nmap.portsweep.threshold=20

# Per-(source,destination,type) alert cooldown in milliseconds.
#nmap.cooldown.ms=2000

# ── LowAndSlowScanDetector ───────────────────────────────────────────────────
# Distinct destination ports accumulated over the long window before a
# low-and-slow alert.
#scan.slow.port.threshold=15

# Long observation window (ms). Default 5 minutes.
#scan.slow.window.ms=300000

# Minimum gap between probes (ms) for traffic to count as "deliberately slow"
# (faster probing is NmapScanDetector's territory — avoids double-counting).
#scan.slow.min.gap.ms=1000

# ── PortKnockingDetector ─────────────────────────────────────────────────────
# Distinct ports hit in sequence before a port-knocking alert. Raise to 4-5
# if client port-fallback behavior (apps trying several candidate ports)
# causes noise.
#knock.sequence.min=3

# Window (ms) the knock sequence must complete within.
#knock.window.ms=10000

# ── LateralMovementDetector ──────────────────────────────────────────────────
# Distinct INTERNAL hosts contacted on sensitive admin ports (SSH/RDP/SMB/
# WinRM/...) within the window before a lateral-movement alert.
#lateral.host.threshold=5

# Window (ms) for the host-contact count. Default 30 seconds.
#lateral.window.ms=30000

# ── HttpAnomalyDetector ──────────────────────────────────────────────────────
# HTTP requests from one source to ONE destination within 2s before a flood
# alert.
#http.flood.threshold=50
