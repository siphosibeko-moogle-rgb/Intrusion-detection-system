plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.ids.mobile'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.ids.mobile"
        minSdk = 26          // java.time is available natively from API 26
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"

        // 10.0.2.2 is the EMULATOR's alias for the host machine's loopback.
        // On a physical device this is wrong — use your dev machine's LAN IP.
        // The login screen overrides this at runtime anyway.
        buildConfigField "String", "DEFAULT_BASE_URL", '"http://10.0.2.2:8080"'
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.2'

    // OkHttp only. JSON via org.json, which ships inside the Android runtime —
    // zero APK cost, zero ProGuard rules.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}