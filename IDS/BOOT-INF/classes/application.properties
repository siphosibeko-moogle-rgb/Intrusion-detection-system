# Server
server.port=8080

# JWT
ids.jwt.secret=IDS-Super-Secret-JWT-Key-2024-ChangeInProduction
ids.jwt.expiration=86400000

# Engine API key
ids.engine.apikey=ids-engine-secret-key-2024

# Logging
logging.level.com.ids=INFO
logging.level.org.springframework.security=WARN

# PostgreSQL
spring.datasource.url=jdbc:postgresql://db:5432/ids_db
spring.datasource.username=ids_user
spring.datasource.password=ids_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.websocket.path=/ws

jwt.secret=IDS-Super-Secret-JWT-Key-2024-ChangeInProduction
jwt.expiration=86400000

management.endpoints.web.exposure.include=health
management.health.db.enabled=false
management.endpoint.health.show-details=never
